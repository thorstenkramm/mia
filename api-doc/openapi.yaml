openapi: 3.2.0
info:
  title: MIA API
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Transport contract for the implemented MIA API. JSON documents use JSON:API 1.1.
    API routes have no trailing-slash variant. Unknown routes and unsupported methods reach ordinary JSON:API 404/405
    handling before Accept negotiation. Raw image uploads, multipart uploads, binary downloads, and NDJSON streams are
    exempt from JSON:API Accept negotiation.
servers:
  - url: /
tags:
  - name: Authentication
    description: Login, password recovery, browser-session stages, and MFA.
  - name: Invitations
    description: Staff invitation creation, management, preview, and acceptance.
  - name: Users
    description: User profile, mobile, avatar, role, and student-security operations.
  - name: Courses
    description: Course configuration, lifecycle, supervisors, students, and logos.
  - name: Materials
    description: Course learning materials, files, briefs, and approval lifecycle.
  - name: Jobs
    description: Administrator and subject-scoped background-job oversight.
  - name: Tutoring
    description: Tutoring sessions, immutable chat, streaming responses, and completed-session review.
security:
  - sessionCookie: []
paths:
  /api/v1/auth/login:
    $ref: paths/auth.yaml#/login
  /api/v1/auth/logout:

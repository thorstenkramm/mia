components:
  headers:
    CacheControlNoStore:
      description: Prohibits browsers and intermediaries from storing or replaying the API response.
      schema: { type: string, const: no-store }
    StrongETag:
      description: Strong validator for the current invitation representation and state-dependent DELETE effect.
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    SessionIdleExpiresAt:
      description: Authoritative idle deadline, unchanged except after Continue working.
      schema: { type: string, format: date-time }
    SessionAbsoluteExpiresAt:
      description: Authoritative fixed absolute browser-session deadline.
      schema: { type: string, format: date-time }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mia_session
      description: >-
        Signed and encrypted HttpOnly browser session cookie for HTTPS. It is valid only with the independently signed
        __Host-mia_browser generation cookie. Loopback HTTP uses mia_session and mia_browser. Logout rotates the marker
        so delayed ordinary authenticated and Continue working responses cannot restore usable authentication.
        Authentication transitions persist and reissue the marker for the bound session's absolute lifetime; a delayed
        transition admitted before logout may therefore restore authentication and requires session discovery
        reconciliation. The stateless MVP has no server-side per-browser revocation or remote revocation.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the matching CSRF cookie on every unsafe API request. HTTPS uses __Host-mia_csrf; loopback HTTP uses mia_csrf.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag obtained from the latest authorized review GET for this resource.
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CourseID:
      name: course_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    StudentID:
      name: student_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: page[limit]
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageOffset:
      name: page[offset]
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    MFAProof:
      name: X-MFA-Management-Proof
      in: header
      required: false
      schema: { type: string, format: uuid }

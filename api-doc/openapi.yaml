components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mia_session
      description: Signed and encrypted HttpOnly browser session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the matching __Host-mia_csrf cookie on every unsafe API request.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CourseID:
      name: course_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: page[limit]
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageOffset:
      name: page[offset]
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    MFAProof:
      name: X-MFA-Management-Proof
      in: header
      required: false
      schema: { type: string, format: uuid }

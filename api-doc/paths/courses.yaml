        description: Created or existing membership.
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/CourseStudentDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: CSRF or restricted session (`csrf_invalid` or `auth_password_change_required`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Hidden course or existing student (`course_not_found` or `course_student_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '409':
        $ref: ../responses/errors.yaml#/Conflict
        description: Inactive course or duplicate provisioned username (`course_invalid_state` or `username_taken`).
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Invalid mode, credentials, or profile (`course_student_invalid`).

student:
  get:
    tags: [Courses]
    operationId: getCourseStudentMembership
    summary: Review course membership removal
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/ResourceID }
      - { $ref: ../openapi.yaml#/components/parameters/UserID }
    responses:
      '200':
        description: Current membership, removal eligibility, consequences, and effect-complete validator.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
          ETag: { $ref: ../openapi.yaml#/components/headers/StrongETag }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/CourseStudentReviewDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Missing or out-of-scope membership (`course_student_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: Current active-session guard could not be evaluated (`course_readiness_unavailable`).
  delete:
    tags: [Courses]
    operationId: removeCourseStudent
    summary: Remove course membership
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/ResourceID }
      - { $ref: ../openapi.yaml#/components/parameters/UserID }
      - { $ref: ../openapi.yaml#/components/parameters/IfMatch }
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Membership and student course-scoped data removed.
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: CSRF or restricted session (`csrf_invalid` or `auth_password_change_required`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Hidden course or membership (`course_not_found` or `course_student_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }

      '412':
        $ref: ../responses/errors.yaml#/PreconditionFailed
        description: Membership or active-session state changed (`course_precondition_failed`).
      '428':
        $ref: ../responses/errors.yaml#/PreconditionRequired
        description: A current membership-review ETag is required (`course_precondition_required`).
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: Current active-session guard could not be evaluated (`course_readiness_unavailable`).


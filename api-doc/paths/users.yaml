me:
  get:
    tags: [Users]
    operationId: getMe
    summary: Get current profile
    security: [{ sessionCookie: [] }]
    responses:
      '200':
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        description: Current user profile.
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/UserDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: Restricted session (`auth_password_change_required`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
  patch:
    tags: [Users]
    operationId: updateMe
    summary: Update current staff profile
    security: [{ sessionCookie: [], csrfToken: [] }]
    requestBody:
      required: true
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/requests/requests.yaml#/ProfileUpdateRequestDocument }
    responses:
      '200':
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        description: Updated user profile.
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/UserDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only self-edit (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Invalid identity, empty patch, or profile field (`user_profile_invalid`).

capabilities:
  get:
    tags: [Users]
    operationId: getCurrentAccountCapabilities
    summary: Get current account capabilities and scopes
    description: Navigation guidance only; every operation independently reauthorizes current state.
    security: [{ sessionCookie: [] }]
    responses:
      '200':
        description: Stable release-one actions with explicit current scope, including unavailable actions.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/AccountCapabilitiesDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: Restricted session (`auth_password_change_required`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }

accounts:
  get:
    tags: [Users]
    operationId: listAdministrationAccounts
    summary: List minimal account administration targets
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/PageLimit }
      - { $ref: ../openapi.yaml#/components/parameters/PageOffset }
      - name: filter[username]
        in: query
        schema: { type: string, minLength: 3, maxLength: 32 }
        description: Exact username after ASCII-lowercase normalization.
      - name: filter[account_class]
        in: query
        schema: { type: string, enum: [staff, student_only] }
      - name: filter[role]
        in: query
        schema: { type: string, enum: [administrator, supervisor, mentor, student] }
      - name: filter[state]
        in: query
        schema: { type: string, enum: [active, banned] }
    responses:
      '200':
        description: Minimal accounts ordered by normalized username and opaque ID; no matches returns an empty page.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/AdministrationAccountCollectionDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: Restricted session or non-administrator (`user_administration_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Unsupported, duplicate, empty, malformed, or excessive query (`user_account_query_invalid`).
mentorTargetPreflights:
  post:
    tags: [Users]
    operationId: preflightMentorRoleTarget
    summary: Resolve one exact eligible mentor-role target
    description: >-
      Supervisor-only, CSRF-protected non-mutating preflight. It performs no browse, partial, fuzzy, batch,
      autocomplete, suggestion, pagination, or result-count operation and creates no durable resolution record.
      Attempts are limited to 10 per supervisor account and 30 per trusted source IP in a rolling hour. Well-formed
      unknown IDs, inaccessible or ineligible targets, and throttling share one fixed unavailable response without
      `Retry-After`; clients reconcile only by submitting a new preflight and never replay a grant automatically.
    security: [{ sessionCookie: [], csrfToken: [] }]
    requestBody:
      required: true
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/requests/requests.yaml#/MentorTargetPreflightRequestDocument }
    responses:
      '200':
        description: Minimal wrong-person-prevention identity and current mentor grant state.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
          ETag: { $ref: ../openapi.yaml#/components/headers/StrongETag }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentorRoleTargetDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: CSRF, restricted session, or non-supervisor (`user_role_unauthorized`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: >-
          Fixed unavailable outcome for well-formed unknown IDs, hidden or ineligible targets, and either exhausted
          limiter dimension (`user_mentor_target_unavailable`). No `Retry-After` is returned.
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: >-
          Invalid resource type, client-generated resource ID, or a missing, null, non-string, or noncanonical
          `data.attributes.user_id` (`auth_invalid_request`). This validation occurs before target lookup and dedicated
          throttling.
mobileChallenges:
  get:
    tags: [Users]
    operationId: getMobileVerificationState
    summary: Read current mobile-verification state
    security: [{ sessionCookie: [] }]
    responses:
      '200':
        description: Authoritative current-account lifecycle and resend eligibility without sensitive values.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MobileVerificationStateDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: Restricted session or student-only profile (`auth_password_change_required` or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
  post:
    tags: [Users]
    operationId: createMobileChallenge
    summary: Start mobile challenge
    security: [{ sessionCookie: [], csrfToken: [] }]
    requestBody:
      required: true
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/requests/requests.yaml#/MobileChallengeRequestDocument }
    responses:
      '201':
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        description: >-
          Authoritative post-delivery lifecycle projection. It may be expired when the original expiry passes during
          delivery; the persisted expiry is unchanged. The destination and code are sent only to ClickSend.
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MobileVerificationStateDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only profile (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Invalid resource or E.164 mobile (`user_profile_invalid`).
      '429':
        $ref: ../responses/errors.yaml#/RateLimited
        description: >-
          SMS cooldown (`user_mobile_resend_cooldown`), hourly/daily capacity, or the layered mobile-operation limiter
          (`rate_limited`). `Retry-After` is included when the next attempt is known without exposing limiter identity.
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: SMS verification unavailable (`user_mobile_unavailable`).

mobileChallengeVerifications:
  post:
    tags: [Users]
    operationId: verifyMobileChallenge
    summary: Verify mobile challenge
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    requestBody:
      required: true
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/requests/requests.yaml#/MobileVerificationRequestDocument }
    responses:
      '200':
        description: Completed lifecycle; mobile verified and pending SMS factors invalidated.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MobileVerificationStateDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only profile (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: >-
          Invalid resource, challenge, or code (`user_profile_invalid`, `user_mobile_challenge_invalid`, or
          `user_mobile_code_invalid`).
      '429': { $ref: ../responses/errors.yaml#/RateLimited }

mobileChallengeResends:
  post:
    tags: [Users]
    operationId: resendMobileChallenge
    summary: Resend mobile challenge
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    responses:
      '200':
        description: >-
          Authoritative post-delivery lifecycle projection after sending the existing code. It may be expired when the
          original expiry passes during delivery; resend does not alter the persisted expiry or reset failures.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MobileVerificationStateDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only profile (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Invalid or expired challenge (`user_mobile_challenge_invalid`).
      '429':
        $ref: ../responses/errors.yaml#/RateLimited
        description: >-
          Resend cooldown (`user_mobile_resend_cooldown`) or hourly/daily capacity (`rate_limited`). `Retry-After`
          identifies the next permitted attempt without disclosing the limiting account or destination dimension.
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: SMS verification unavailable (`user_mobile_unavailable`).

mobile:
  delete:
    tags: [Users]
    operationId: removeMobile
    summary: Remove verified mobile
    security: [{ sessionCookie: [], csrfToken: [] }]
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Verified mobile and pending mobile state removed.
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only profile (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }

avatar:
  get:
    tags: [Users]
    operationId: getAvatar
    summary: Download avatar PNG
    security: [{ sessionCookie: [] }]
    responses:
      '200':
        description: Metadata-free PNG protected by Cache-Control no-store without a validator-based cache exception.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
        content:
          image/png:
            schema: { $ref: ../schemas/json-api/documents.yaml#/BinaryPayload }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: Restricted session (`auth_password_change_required`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Avatar is absent (`not_found`).
  put:
    tags: [Users]
    operationId: putAvatar
    summary: Upload avatar
    description: Raw image/jpeg or image/png body without media-type parameters; maximum 10 MiB.
    security: [{ sessionCookie: [], csrfToken: [] }]
    requestBody:
      required: true
      content:
        image/jpeg:
          schema: { $ref: ../schemas/requests/requests.yaml#/ImageUploadRequest }
        image/png:
          schema: { $ref: ../schemas/requests/requests.yaml#/ImageUploadRequest }
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Normalized PNG avatar saved.
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only profile (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Invalid media type, size, signature, dimensions, or image (`user_avatar_invalid`).
  delete:
    tags: [Users]
    operationId: deleteAvatar
    summary: Delete avatar
    security: [{ sessionCookie: [], csrfToken: [] }]
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Avatar deleted; absence is idempotent.
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or student-only profile (`csrf_invalid`, `auth_password_change_required`, or
          `user_profile_unauthorized`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }

roles:
  post:
    tags: [Users]
    operationId: grantRole
    summary: Grant permanent staff role
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/ResourceID }
      - name: If-Match
        in: header
        required: true
        description: >-
          Exact account-detail ETag for administrator or supervisor grants, or exact mentor-target preflight ETag for
          a mentor grant. Missing and stale values perform no mutation and require a fresh applicable review.
        schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    requestBody:
      required: true
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/requests/requests.yaml#/RoleGrantRequestDocument }
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Role granted immediately; an existing grant is idempotent.
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, or actor authorization (`csrf_invalid`, `auth_password_change_required`, or
          `user_role_unauthorized`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Missing or ineligible target is hidden (`user_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '412': { $ref: ../responses/errors.yaml#/PreconditionFailed }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422':
        $ref: ../responses/errors.yaml#/Unprocessable
        description: Invalid resource type or role (`auth_invalid_request`).
      '428': { $ref: ../responses/errors.yaml#/PreconditionRequired }

account:
  get:
    tags: [Users]
    operationId: getAdministrationAccount
    summary: Get a minimal account administration target
    security: [{ sessionCookie: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    responses:
      '200':
        description: Current target state, action eligibility, consequence identifiers, and review validator.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
          ETag: { $ref: ../openapi.yaml#/components/headers/StrongETag }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/AdministrationAccountDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: Restricted session or non-administrator (`user_administration_unauthorized`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Missing or inaccessible target (`user_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
  delete:
    tags: [Users]
    operationId: deleteUser
    summary: Delete an account and its operational data
    description: >-
      An administrator may delete a student-only account. Staff accounts require a different administrator.
      The last administrator and a sole course supervisor cannot be deleted.
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/ResourceID }
      - { $ref: ../openapi.yaml#/components/parameters/IfMatch }
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Account and operational data deleted.
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: >-
          CSRF, restricted session, non-administrator, or self-targeted staff deletion (`csrf_invalid`,
          `auth_password_change_required`, or `user_deletion_unauthorized`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Missing target (`user_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '409':
        $ref: ../responses/errors.yaml#/Conflict
        description: >-
          Protected last administrator or sole course supervisor (`user_last_administrator` or
          `user_sole_supervisor`).
      '412': { $ref: ../responses/errors.yaml#/PreconditionFailed }
      '428': { $ref: ../responses/errors.yaml#/PreconditionRequired }

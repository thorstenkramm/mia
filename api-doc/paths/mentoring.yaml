studentProfile:
  patch:
    tags: [Users]
    operationId: updateStudentProfile
    summary: Update supervisor-managed student-only profile fields
    description: >-
      Only a supervisor assigned to a course shared with the student-only account
      may update these global fields. Students cannot use this route or self-edit
      their profile fields.
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    requestBody:
      required: true
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/requests/requests.yaml#/StudentProfileUpdateRequestDocument }
    responses:
      '204':
        $ref: ../responses/success.yaml#/NoContent
        description: Student profile fields updated.
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403':
        $ref: ../responses/errors.yaml#/Forbidden
        description: CSRF or restricted session (`csrf_invalid` or `auth_password_change_required`).
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Missing, staff, student caller, or out-of-scope student (`course_student_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422': { $ref: ../responses/errors.yaml#/Unprocessable }

courseMentors:
  get:
    tags: [Mentoring]
    operationId: listCourseMentors
    summary: List course mentors as user identifiers
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/PageLimit }
      - { $ref: ../openapi.yaml#/components/parameters/PageOffset }
    responses: { '200': { $ref: '#/components/responses/MentorList' }, '401': { $ref: ../responses/errors.yaml#/Unauthorized }, '403': { $ref: ../responses/errors.yaml#/Forbidden }, '404': { $ref: ../responses/errors.yaml#/NotFound }, '406': { $ref: ../responses/errors.yaml#/NotAcceptable }, '422': { $ref: ../responses/errors.yaml#/Unprocessable } }
  post:
    tags: [Mentoring]
    operationId: assignCourseMentor
    summary: Assign a registered mentor to a course
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/CourseID }]
    requestBody:
      required: true
      content: { application/vnd.api+json: { schema: { $ref: ../schemas/requests/requests.yaml#/CourseMentorAssignmentRequestDocument } } }
    responses: { '204': { $ref: ../responses/success.yaml#/NoContent, description: Assignment exists. }, '400': { $ref: ../responses/errors.yaml#/BadRequest }, '401': { $ref: ../responses/errors.yaml#/Unauthorized }, '403': { $ref: ../responses/errors.yaml#/Forbidden }, '404': { $ref: ../responses/errors.yaml#/NotFound }, '406': { $ref: ../responses/errors.yaml#/NotAcceptable }, '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }, '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }, '422': { $ref: ../responses/errors.yaml#/Unprocessable } }

courseMentor:
  get:
    tags: [Mentoring]
    operationId: reviewCourseMentorRemoval
    summary: Review course-mentor removal and its current open-work consequences
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/UserID }
    responses:
      '200':
        description: Current removal review and strong validator.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
          ETag: { $ref: ../openapi.yaml#/components/headers/StrongETag }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentorRemovalReviewDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404': { $ref: ../responses/errors.yaml#/NotFound }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
  delete:
    tags: [Mentoring]
    operationId: removeCourseMentor
    summary: Remove a course mentor and return their open work to triage
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/UserID }
      - { $ref: ../openapi.yaml#/components/parameters/IfMatch }
    responses: { '204': { $ref: ../responses/success.yaml#/NoContent, description: Mentor removed and open work triaged. }, '401': { $ref: ../responses/errors.yaml#/Unauthorized }, '403': { $ref: ../responses/errors.yaml#/Forbidden, description: CSRF or restricted session (`csrf_invalid` or `auth_password_change_required`). }, '404': { $ref: ../responses/errors.yaml#/NotFound }, '406': { $ref: ../responses/errors.yaml#/NotAcceptable }, '412': { $ref: ../responses/errors.yaml#/PreconditionFailed, description: Reviewed assignment or open work changed (`mentoring_precondition_failed`). }, '428': { $ref: ../responses/errors.yaml#/PreconditionRequired, description: A current removal review is required (`mentoring_precondition_required`). } }

studentMentors:
  get:
    tags: [Mentoring]
    operationId: listStudentMentors
    summary: List mentors assigned to a course student
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/StudentID }
      - { $ref: ../openapi.yaml#/components/parameters/PageLimit }
      - { $ref: ../openapi.yaml#/components/parameters/PageOffset }
    responses: { '200': { $ref: '#/components/responses/MentorList' }, '401': { $ref: ../responses/errors.yaml#/Unauthorized }, '403': { $ref: ../responses/errors.yaml#/Forbidden }, '404': { $ref: ../responses/errors.yaml#/NotFound }, '406': { $ref: ../responses/errors.yaml#/NotAcceptable }, '422': { $ref: ../responses/errors.yaml#/Unprocessable } }
  post:
    tags: [Mentoring]
    operationId: assignStudentMentor
    summary: Assign a course mentor to a student
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/StudentID }
    requestBody:
      required: true
      content: { application/vnd.api+json: { schema: { $ref: ../schemas/requests/requests.yaml#/StudentMentorAssignmentRequestDocument } } }
    responses: { '204': { $ref: ../responses/success.yaml#/NoContent, description: Assignment exists. }, '400': { $ref: ../responses/errors.yaml#/BadRequest }, '401': { $ref: ../responses/errors.yaml#/Unauthorized }, '403': { $ref: ../responses/errors.yaml#/Forbidden }, '404': { $ref: ../responses/errors.yaml#/NotFound }, '406': { $ref: ../responses/errors.yaml#/NotAcceptable }, '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }, '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }, '422': { $ref: ../responses/errors.yaml#/Unprocessable } }

studentMentor:
  get:
    tags: [Mentoring]
    operationId: reviewStudentMentorRemoval
    summary: Review student-mentor removal and its current open-work consequences
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/StudentID }
      - { $ref: ../openapi.yaml#/components/parameters/UserID }
    responses:
      '200':
        description: Current removal review and strong validator.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
          ETag: { $ref: ../openapi.yaml#/components/headers/StrongETag }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentorRemovalReviewDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404': { $ref: ../responses/errors.yaml#/NotFound }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
  delete:
    tags: [Mentoring]
    operationId: removeStudentMentor
    summary: Remove one student mentor and return affected open work to triage
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/StudentID }
      - { $ref: ../openapi.yaml#/components/parameters/UserID }
      - { $ref: ../openapi.yaml#/components/parameters/IfMatch }
    responses: { '204': { $ref: ../responses/success.yaml#/NoContent, description: Assignment removed and open work triaged. }, '401': { $ref: ../responses/errors.yaml#/Unauthorized }, '403': { $ref: ../responses/errors.yaml#/Forbidden, description: CSRF or restricted session (`csrf_invalid` or `auth_password_change_required`). }, '404': { $ref: ../responses/errors.yaml#/NotFound }, '406': { $ref: ../responses/errors.yaml#/NotAcceptable }, '412': { $ref: ../responses/errors.yaml#/PreconditionFailed, description: Reviewed assignment or open work changed (`mentoring_precondition_failed`). }, '428': { $ref: ../responses/errors.yaml#/PreconditionRequired, description: A current removal review is required (`mentoring_precondition_required`). } }

mentorStudentProfile:
  get:
    tags: [Mentoring]
    operationId: getMentorStudentProfile
    summary: Get the minimal identity of a student explicitly assigned to the current mentor
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/StudentID }
    responses:
      '200':
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        description: Assignment-scoped username, name, nickname, and avatar URL.
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentorStudentProfileDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Student, course, or explicit mentor assignment is absent (`mentoring_not_found`).
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }

mentorStudentAvatar:
  get:
    tags: [Mentoring]
    operationId: getMentorStudentAvatar
    summary: Download the avatar of a student explicitly assigned to the current mentor
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/StudentID }
    responses:
      '200':
        description: Normalized PNG protected by Cache-Control no-store without a validator-based cache exception.
        headers:
          Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore }
        content:
          image/png:
            schema: { $ref: ../schemas/json-api/documents.yaml#/BinaryPayload }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: Avatar or explicit mentor assignment is absent (`mentoring_not_found`).

courseMentoringSessions:
  get:
    tags: [Mentoring]
    operationId: listMentoringSessions
    summary: List mentoring sessions visible to the current participant or supervisor
    security: [{ sessionCookie: [] }]
    parameters:
      - { $ref: ../openapi.yaml#/components/parameters/CourseID }
      - { $ref: ../openapi.yaml#/components/parameters/PageLimit }
      - { $ref: ../openapi.yaml#/components/parameters/PageOffset }
    responses:
      '200':
        description: Paginated mentoring-session collection.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentoringSessionCollectionDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404': { $ref: ../responses/errors.yaml#/NotFound }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '422': { $ref: ../responses/errors.yaml#/Unprocessable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: >-
          A session completion projection could not be established (`mentoring_state_unavailable`). No collection is
          authoritative; explicitly repeat this safe list read to reconcile current state.
  post:
    tags: [Mentoring]
    operationId: createMentoringSession
    summary: Create an unassigned last-resource mentoring request
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/CourseID }]
    requestBody:
      required: true
      content: { application/vnd.api+json: { schema: { $ref: ../schemas/requests/requests.yaml#/MentoringSessionCreateRequestDocument } } }
    responses:
      '201':
        description: Unassigned mentoring request.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentoringSessionDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404': { $ref: ../responses/errors.yaml#/NotFound }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '409': { $ref: ../responses/errors.yaml#/Conflict }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422': { $ref: ../responses/errors.yaml#/Unprocessable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: >-
          The request may have committed but its completion projection could not be established
          (`mentoring_state_unavailable`). Do not replay POST; reconcile by explicitly reading the current course list.

mentoringRequestEligibility:
  get:
    tags: [Mentoring]
    operationId: getMentoringRequestEligibility
    summary: Check current student mentoring-request eligibility
    description: >-
      Atomically evaluates current course membership, course activity, the request setting, and qualifying assignment.
      Disabled does not identify which creation gate is closed. Access-lost reveals no course or membership existence.
    security: [{ sessionCookie: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/CourseID }]
    responses:
      '200':
        description: Current allowed, neutrally disabled, or access-lost projection.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentoringRequestEligibilityDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: >-
          Current eligibility could not be established (`mentoring_state_unavailable`); unavailable is an error outcome,
          not a successful resource state.

mentoringSession:
  get:
    tags: [Mentoring]
    operationId: getMentoringSession
    summary: Get an authorized mentoring session
    security: [{ sessionCookie: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    responses:
      '200':
        description: Current mentoring workflow state.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentoringSessionDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404': { $ref: ../responses/errors.yaml#/NotFound }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: >-
          Current completion eligibility could not be established (`mentoring_state_unavailable`). Explicitly repeat
          this safe GET to reconcile; no prior representation remains authoritative.
  patch:
    tags: [Mentoring]
    operationId: updateMentoringSession
    summary: Triage, respond, schedule, reschedule, cancel, or complete mentoring work
    security: [{ sessionCookie: [], csrfToken: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    requestBody:
      required: true
      content: { application/vnd.api+json: { schema: { $ref: ../schemas/requests/requests.yaml#/MentoringSessionUpdateRequestDocument } } }
    responses:
      '200':
        description: Updated mentoring workflow state.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentoringSessionDocument }
      '400': { $ref: ../responses/errors.yaml#/BadRequest }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404': { $ref: ../responses/errors.yaml#/NotFound }
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '409': { $ref: ../responses/errors.yaml#/Conflict }
      '413': { $ref: ../responses/errors.yaml#/RequestTooLarge }
      '415': { $ref: ../responses/errors.yaml#/UnsupportedMediaType }
      '422': { $ref: ../responses/errors.yaml#/Unprocessable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: >-
          The update may have committed but its completion projection could not be established
          (`mentoring_state_unavailable`). Do not replay PATCH; reconcile by explicitly reading this mentoring session.

mentoringCompletionEligibility:
  get:
    tags: [Mentoring]
    operationId: getMentoringCompletionEligibility
    summary: Freshly check viewer-specific mentoring completion eligibility
    description: >-
      Uses current assignment, lifecycle, schedule, authorization, and server time. A future recheck instant is advisory;
      a fresh allowed response is still required immediately before confirmation.
    security: [{ sessionCookie: [] }]
    parameters: [{ $ref: ../openapi.yaml#/components/parameters/ResourceID }]
    responses:
      '200':
        description: Current allowed, not-allowed, or terminal completion projection.
        headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
        content:
          application/vnd.api+json:
            schema: { $ref: ../schemas/resources/resources.yaml#/MentoringCompletionEligibilityDocument }
      '401': { $ref: ../responses/errors.yaml#/Unauthorized }
      '403': { $ref: ../responses/errors.yaml#/Forbidden }
      '404':
        $ref: ../responses/errors.yaml#/NotFound
        description: >-
          Missing, out-of-scope, or assignment-lost work (`mentoring_not_found`); access-lost is an error outcome, not a
          successful resource state.
      '406': { $ref: ../responses/errors.yaml#/NotAcceptable }
      '503':
        $ref: ../responses/errors.yaml#/ServiceUnavailable
        description: >-
          Current eligibility could not be established (`mentoring_state_unavailable`); unavailable is an error outcome,
          not a successful resource state.

components:
  responses:
    MentorList:
      description: Paginated user identifiers for assigned mentors.
      headers: { Cache-Control: { $ref: ../openapi.yaml#/components/headers/CacheControlNoStore } }
      content:
        application/vnd.api+json:
          schema: { $ref: ../schemas/resources/resources.yaml#/MentorIdentifierCollectionDocument }

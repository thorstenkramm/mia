# Response resource schemas and JSON:API document wrappers.
# Every schema here is wired into at least one operation in api-doc/paths/.

User:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: users
    id:
      type: string
    attributes:
      type: object
      required:
        - username
        - email
        - name
        - nickname
        - preferred_language
        - country
        - time_zone
        - tts_voice
        - has_verified_mobile
        - avatar_url
      properties:
        username:
          type: string
        email:
          type: [string, 'null']
          description: Verified staff email. Null for student-only accounts.
        name:
          type: [string, 'null']
        nickname:
          type: [string, 'null']
        preferred_language:
          type: string
        country:
          type: string
        time_zone:
          type: string
          description: Preferred IANA time zone for display.
        tts_voice:
          type: [string, 'null']
          description: >-
            Staff may manage their own voice. Only an assigned supervisor sharing
            a course may manage this field for a student-only account; students
            cannot select it themselves.
        has_verified_mobile:
          type: boolean
        avatar_url:
          type: [string, 'null']
          description: Relative avatar download URL, or null without an avatar.
CapabilityScope:
  type: object
  required: [global, course_ids, student_ids, course_students, own_resource]
  additionalProperties: false
  properties:
    global: { type: boolean }
    course_ids:
      type: array
      items: { type: string }
    student_ids:
      type: array
      items: { type: string }
    course_students:
      type: array
      description: Paired scope for actions that require both course and student assignment.
      items:
        type: object
        required: [course_id, student_id]
        additionalProperties: false
        properties:
          course_id: { type: string }
          student_id: { type: string }
    own_resource: { type: boolean }
AccountCapability:
  type: object
  required: [action, available, scope]
  additionalProperties: false
  properties:
    action:
      type: string
      enum:
        - profile.view
        - profile.edit
        - accounts.administer
        - audit.view
        - jobs.view
        - courses.create
        - course_records.manage
        - course_supervisors.manage
        - courses.supervise
        - students.manage
        - students.ban
        - students.unban
        - learning.participate
        - mentoring.fulfill
    available: { type: boolean }
    scope: { $ref: '#/CapabilityScope' }
AccountCapabilities:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: account-capabilities }
    id: { type: string }
    attributes:
      type: object
      required: [capabilities]
      additionalProperties: false
      properties:
        capabilities:
          type: array
          minItems: 14
          maxItems: 14
          items: { $ref: '#/AccountCapability' }
AdministrationActionEligibility:
  type: object
  required: [eligible, blockers, consequences]
  additionalProperties: false
  properties:
    eligible: { type: boolean }
    blockers:
      type: array
      items: { $ref: '#/AdministrationActionBlocker' }
    consequences:
      type: array
      items: { $ref: '#/AdministrationActionConsequence' }
AdministrationActionBlocker:
  type: string
  enum:
    - registered_verified_staff_required
    - different_administrator_required
    - last_administrator
    - sole_course_supervisor
  description: |
    Stable reason that a reviewed action is unavailable:
    * `registered_verified_staff_required` — role grants require an active, verified staff account.
    * `different_administrator_required` — a staff account must be deleted by another administrator.
    * `last_administrator` — deleting the final administrator is prohibited.
    * `sole_course_supervisor` — deletion would leave a course without a supervisor.
AdministrationActionConsequence:
  type: string
  enum:
    - grant_administrator_role
    - grant_supervisor_role
    - grant_student_role
    - delete_account_operational_data
    - deidentify_audit_history
    - remove_assignments
    - triage_open_work
    - clear_actor_references
  description: |
    Stable effect included in the reviewed state:
    * `grant_administrator_role` — add the permanent administrator role.
    * `grant_supervisor_role` — add the permanent supervisor role.
    * `grant_student_role` — add the coupled permanent student role with a supervisor grant.
    * `delete_account_operational_data` — remove retained operational data owned by the account.
    * `deidentify_audit_history` — preserve content-free audit history without the deleted actor reference.
    * `remove_assignments` — remove the staff account's current assignments.
    * `triage_open_work` — return affected open work to supervisor triage.
    * `clear_actor_references` — clear historical actor references required by deletion.
AdministrationActions:
  type: object
  required: [grant_role, delete]
  additionalProperties: false
  properties:
    grant_role:
      type: object
      required: [administrator, supervisor]
      additionalProperties: false
      properties:
        administrator: { $ref: '#/AdministrationActionEligibility' }
        supervisor: { $ref: '#/AdministrationActionEligibility' }
    delete: { $ref: '#/AdministrationActionEligibility' }
AdministrationAccount:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: administration-accounts }
    id: { type: string }
    attributes:
      type: object
      required: [username, account_class, account_state, permanent_roles]
      additionalProperties: false
      properties:
        username: { type: string }
        account_class: { type: string, enum: [staff, student_only] }
        account_state: { type: string, enum: [active, banned] }
        permanent_roles:
          type: array
          items: { type: string, enum: [administrator, supervisor, mentor, student] }
AdministrationAccountDetail:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: administration-accounts }
    id: { type: string }
    attributes:
      type: object
      required: [username, account_class, account_state, permanent_roles, actions]
      additionalProperties: false
      properties:
        username: { type: string }
        account_class: { type: string, enum: [staff, student_only] }
        account_state: { type: string, enum: [active, banned] }
        permanent_roles:
          type: array
          items: { type: string, enum: [administrator, supervisor, mentor, student] }
        actions: { $ref: '#/AdministrationActions' }
CreatedUser:
  description: >-
    Identity-only users resource returned by invitation acceptance. Attributes
    are intentionally empty; the new account signs in through the normal login.
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: users
    id:
      type: string
    attributes:
      type: object
      additionalProperties: false
AuthSession:
  description: >-
    Singleton view of the current cookie session. By the named `auth-sessions`
    identity exception, the resource ID is the account ID: repeated logins and
    stage transitions for one account return the same `(type, id)`.
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: auth-sessions
    id:
      type: string
      description: The account ID (named auth-sessions identity exception).
    attributes:
      type: object
      required: [stage, idle_expires_at, absolute_expires_at]
      properties:
        stage:
          type: string
          enum: [authenticated, mfa, password-change]
        mfa_challenge_id:
          type: string
          description: Present only in the `mfa` stage.
        idle_expires_at:
          type: string
          format: date-time
          description: Idle deadline advanced only by Continue working.
        absolute_expires_at:
          type: string
          format: date-time
          description: Fixed maximum deadline for this login stage or authenticated lifetime.
SessionDiscoveryDocument:
  oneOf:
    - $ref: '#/AuthSessionDocument'
    - $ref: '#/AnonymousAuthSessionDocument'
AnonymousAuthSessionDocument:
  type: object
  required: [data, meta]
  properties:
    data:
      type: 'null'
    meta:
      type: object
      required: [stage]
      properties:
        stage:
          const: anonymous
MFAManagementProof:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: mfa-management-proofs
    id:
      type: string
      description: Opaque proof resource ID with the `mfp_` prefix.
    attributes:
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          format: uuid
          description: >-
            Single-use bearer proof shown exactly once. Valid for five minutes
            in the `X-MFA-Management-Proof` header or the enrollment `proof`
            attribute. Only its SHA-256 digest is persisted.
MFAEnrollment:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: mfa-enrollments
    id:
      type: string
      description: Pending enrollment ID with the `mfe_` prefix.
    attributes:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [totp, sms]
        provisioning_uri:
          type: string
          description: otpauth:// provisioning URI. Present only for TOTP.
MFARecoveryCodes:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: mfa-recovery-codes
    id:
      type: string
      description: The consumed enrollment ID.
    attributes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            minLength: 16
            maxLength: 16
          description: >-
            Single-use recovery codes shown exactly once. Only non-reversible
            digests are stored.
MFAState:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: mfa-states }
    id: { type: string, description: Authenticated account ID. }
    attributes:
      type: object
      required: [active_factor, pending_enrollment, actions]
      properties:
        active_factor:
          oneOf:
            - type: 'null'
            - $ref: '#/MFAFactorSummary'
        pending_enrollment:
          oneOf:
            - type: 'null'
            - $ref: '#/MFAEnrollmentSummary'
        actions: { $ref: '#/MFAActions' }
MFAFactorSummary:
  type: object
  required: [id, method]
  properties:
    id: { type: string, description: Opaque active-factor ID with the `mff_` prefix. }
    method: { type: string, enum: [totp, sms] }
MFAEnrollmentSummary:
  type: object
  required: [id, method, expires_at, replaces_factor_id]
  properties:
    id: { type: string, description: Opaque pending-enrollment ID with the `mfe_` prefix. }
    method: { type: string, enum: [totp, sms] }
    expires_at: { type: string, format: date-time }
    replaces_factor_id:
      type: [string, 'null']
      description: Active-factor ID replaced on verification, or null for first enrollment.
MFAActions:
  type: object
  required: [enroll, continue, cancel, disable, replace, verify, sms_resend]
  properties:
    enroll: { type: boolean }
    continue: { type: boolean }
    cancel: { type: boolean }
    disable: { type: boolean }
    replace: { type: boolean }
    verify: { type: boolean }
    sms_resend: { type: boolean }
MFAReset:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: mfa-resets }
    id: { type: string, description: Unique non-secret command result ID with the `mfr_` prefix. }
    attributes:
      type: object
      required: [account_class, password_change_required, session_effect, mfa_state]
      properties:
        account_class: { type: string, enum: [student_only, staff] }
        password_change_required: { const: true }
        session_effect: { const: invalidated }
        mfa_state: { const: none }
MobileVerificationState:
  type: object
  required: [type, id, attributes]
  additionalProperties: false
  properties:
    type:
      const: mobile-verification-states
    id:
      type: string
      description: Authenticated account ID identifying this per-account singleton projection.
    attributes:
      type: object
      additionalProperties: false
      required: [state, challenge_id, expires_at, resend_state, next_resend_at]
      properties:
        state:
          type: string
          enum: [active, expired, invalidated, completed, absent, unavailable]
        challenge_id:
          type: [string, 'null']
          description: Opaque current challenge ID used by authorized verification and resend operations.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Original server-authored expiry; never extended by reads or resends.
        resend_state:
          type: string
          enum: [eligible, cooldown, rate_limited, unavailable, not_available]
        next_resend_at:
          type: [string, 'null']
          format: date-time
          description: Earliest known resend instant for cooldown or durable quota exhaustion.
Invitation:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: invitations
    id:
      type: string
    attributes:
      type: object
      required:
        - email
        - role
        - status
        - delivery_state
        - delivery_code
        - delivery_attempted_at
        - created_at
        - updated_at
      properties:
        email:
          type: string
        role:
          type: string
          enum: [administrator, supervisor, mentor]
        status:
          type: string
          enum: [pending, accepted, revoked, faulty]
        failure_code:
          type: string
          description: Present only on faulty invitations.
        delivery_state:
          type: string
          enum: [queued, delivered, ambiguous, failed]
          description: Authoritative latest admitted delivery state; queued and ambiguous remain usable while pending.
        delivery_code:
          type: [string, 'null']
          enum:
            - invitation_delivery_timeout
            - invitation_delivery_ambiguous
            - invitation_delivery_rejected
            - null
          description: Sanitized latest outcome code; timeout and ambiguous never claim delivery.
        delivery_attempted_at:
          type: [string, 'null']
          format: date-time
          description: UTC start time of the latest completed SMTP attempt, or null while only queued.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
InvitationPreview:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: invitation-previews
    id:
      const: preview
    attributes:
      type: object
      required: [platform, role]
      properties:
        platform:
          const: mia
        role:
          type: string
          enum: [administrator, supervisor, mentor]
InvitationDeletion:
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: invitation-deletions
    id:
      type: string
      description: Unique ephemeral command-result ID with the `invd_` prefix.
    attributes:
      type: object
      required: [invitation_id, effect]
      additionalProperties: false
      properties:
        invitation_id:
          type: string
        effect:
          type: string
          enum: [revoked, deleted]
Course:
  type: object
  required: [type, id, attributes, relationships]
  properties:
    type:
      const: courses
    id:
      type: string
    attributes:
      type: object
      required:
        - name
        - description
        - curriculum
        - learning_goals
        - ai_tutor_instructions
        - language
        - state
        - created_at
        - activated_at
        - deactivated_at
        - updated_at
        - logo_url
        - readiness
        - delete
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        curriculum:
          type: [string, 'null']
        learning_goals:
          type: [string, 'null']
        ai_tutor_instructions:
          type: [string, 'null']
        language:
          type: [string, 'null']
        state:
          type: string
          enum: [inactive, active]
        created_at:
          type: string
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
        deactivated_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        logo_url:
          type: [string, 'null']
          description: Relative logo download URL, or null without a logo.
        readiness:
          $ref: '#/CourseReadiness'
        delete:
          $ref: '#/CourseDeletionEligibility'
    relationships:
      type: object
      required: [supervisors]
      properties:
        supervisors:
          type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/UserIdentifier'
CourseStudent:
  type: object
  required: [type, id, attributes, relationships]
  properties:
    type:
      const: course-students
    id:
      type: string
    attributes:
      type: object
      required: [username, joined_at]
      properties:
        username:
          type: string
        joined_at:
          type: string
          format: date-time
    relationships:
      type: object
      required: [course, student]
      properties:
        course:
          $ref: '#/ToOneCourse'
        student:
          $ref: '#/ToOneUser'
CourseStudentReview:
  allOf:
    - $ref: '#/CourseStudent'
    - type: object
      properties:
        attributes:
          type: object
          required: [remove]
          properties:
            remove:
              $ref: '#/CourseMembershipRemovalEligibility'
CourseActivationEligibility:
  type: object
  additionalProperties: false
  required: [eligible, blockers, consequences]
  properties:
    eligible: { type: boolean }
    blockers:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
          - learning_goals
          - ai_tutor_instructions
          - language
          - supervisor_presence
          - qualifying_material
          - course_already_active
          - assigned_supervisor_required
    consequences:
      type: array
      enum:
        - [activate_course]
      items:
        type: string
        enum: [activate_course]
CourseNewSessionEligibility:
  type: object
  additionalProperties: false
  required: [eligible, blockers, consequences]
  properties:
    eligible: { type: boolean }
    blockers:
      type: array
      uniqueItems: true
      items:
        type: string
        enum:
          - learning_goals
          - ai_tutor_instructions
          - language
          - supervisor_presence
          - qualifying_material
          - course_inactive
          - course_not_ready
          - course_membership_required
          - active_tutoring_session
    consequences:
      type: array
      enum:
        - [start_tutoring_session]
      items:
        type: string
        enum: [start_tutoring_session]
CourseDeletionEligibility:
  type: object
  additionalProperties: false
  required: [eligible, blockers, consequences]
  properties:
    eligible: { type: boolean }
    blockers:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [administrator_required, course_active, active_tutoring_session]
    consequences:
      type: array
      enum:
        - [delete_course_scoped_data, preserve_accounts]
      items:
        type: string
        enum: [delete_course_scoped_data, preserve_accounts]
CourseSupervisorRemovalEligibility:
  type: object
  additionalProperties: false
  required: [eligible, blockers, consequences]
  properties:
    eligible: { type: boolean }
    blockers:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [last_supervisor]
    consequences:
      type: array
      enum:
        - [remove_supervisor_assignment]
      items:
        type: string
        enum: [remove_supervisor_assignment]
CourseMembershipRemovalEligibility:
  type: object
  additionalProperties: false
  required: [eligible, blockers, consequences]
  properties:
    eligible: { type: boolean }
    blockers:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [active_tutoring_session]
    consequences:
      type: array
      enum:
        - [delete_student_course_data, preserve_account, preserve_other_course_data]
      items:
        type: string
        enum: [delete_student_course_data, preserve_account, preserve_other_course_data]
CourseReadiness:
  type: object
  additionalProperties: false
  required: [state, activation, new_session, blockers]
  properties:
    state:
      type: string
      enum: [inactive_incomplete, inactive_activatable, active_accepting, active_not_accepting]
    activation: { $ref: '#/CourseActivationEligibility' }
    new_session: { $ref: '#/CourseNewSessionEligibility' }
    blockers:
      type: array
      description: Preparation blockers visible only to an assigned supervisor; other viewers receive an empty array.
      items:
        type: object
        additionalProperties: false
        required: [id, link]
        properties:
          id:
            type: string
            enum: [learning_goals, ai_tutor_instructions, language, supervisor_presence, qualifying_material]
          link: { type: [string, 'null'] }
CourseSupervisorAssignment:
  type: object
  additionalProperties: false
  required: [type, id, attributes, relationships]
  properties:
    type: { const: course-supervisor-assignments }
    id: { type: string }
    attributes:
      type: object
      additionalProperties: false
      required: [remove]
      properties:
        remove: { $ref: '#/CourseSupervisorRemovalEligibility' }
    relationships:
      type: object
      additionalProperties: false
      required: [course, supervisor]
      properties:
        course: { $ref: '#/ToOneCourse' }
        supervisor: { $ref: '#/ToOneUser' }
Material:
  type: object
  required: [type, id, attributes, relationships]
  properties:
    type:
      const: materials
    id:
      type: string
    attributes:
      type: object
      required:
        - name
        - scope
        - kind
        - format
        - state
        - external_url
        - brief
        - brief_source
        - brief_updated_at
        - approved
        - approved_at
        - failure_code
        - created_at
        - updated_at
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [course-wide, student-private]
        kind:
          type: string
          enum: [text-book, exam, worksheet, website, youtube]
        format:
          type: string
          enum: [pdf, jpeg, png, text, markdown, docx, link]
        state:
          type: string
          enum: [draft, processing, ready, failed]
        external_url:
          type: [string, 'null']
        brief:
          oneOf:
            - $ref: '#/Brief'
            - type: 'null'
        brief_source:
          type: [string, 'null']
          enum: [generated, supervisor, null]
        brief_updated_at:
          type: [string, 'null']
          format: date-time
        approved:
          type: boolean
        approved_at:
          type: [string, 'null']
          format: date-time
        failure_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    relationships:
      type: object
      required: [course]
      properties:
        course:
          $ref: '#/ToOneCourse'
MaterialFile:
  type: object
  required: [type, id, attributes, relationships]
  properties:
    type:
      const: material-files
    id:
      type: string
    attributes:
      type: object
      required:
        - original_filename
        - media_type
        - size_bytes
        - page_count
        - state
        - failure_code
        - created_at
        - download_url
        - content_url
      properties:
        original_filename:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        page_count:
          type: integer
        state:
          type: string
          enum: [draft, processing, processed, failed]
        failure_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
        content_url:
          type: string
    relationships:
      type: object
      required: [material]
      properties:
        material:
          $ref: '#/ToOneMaterial'
Job:
  description: Administrator diagnostic job view including provider usage.
  type: object
  required: [type, id, attributes, relationships]
  properties:
    type:
      const: jobs
    id:
      type: string
    attributes:
      type: object
      required:
        - job_type
        - subject_type
        - subject_id
        - state
        - attempt_count
        - available_at
        - created_at
        - started_at
        - finished_at
        - failure_code
        - provider_input_units
        - provider_output_units
      properties:
        job_type:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        attempt_count:
          type: integer
          format: int64
        available_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        failure_code:
          type: [string, 'null']
        provider_input_units:
          type: integer
          format: int64
        provider_output_units:
          type: integer
          format: int64
    relationships:
      type: object
      required: [course]
      properties:
        course:
          $ref: '#/ToOneCourse'
AuditEvent:
  description: Content-free audit record. Fingerprints have no retained identity mapping.
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: audit-events
    id:
      type: string
    attributes:
      type: object
      additionalProperties: false
      required:
        - action
        - actor_user_id
        - actor_fingerprint
        - subject_user_id
        - subject_type
        - subject_fingerprint
        - course_id
        - metadata
        - created_at
      properties:
        action:
          type: string
          maxLength: 128
        actor_user_id:
          type: [string, 'null']
        actor_fingerprint:
          type: [string, 'null']
          format: uuid
        subject_user_id:
          type: [string, 'null']
        subject_type:
          type: [string, 'null']
          enum: [account, course, null]
        subject_fingerprint:
          type: [string, 'null']
          format: uuid
        course_id:
          type: [string, 'null']
        metadata:
          type: [object, 'null']
          additionalProperties: false
          properties:
            invitation_id: { type: string }
            material_id: { type: string }
            outcome_code: { type: string }
            role: { type: string }
            mentoring_session_id: { type: string }
            mentor_id: { type: string }
            mentor_fingerprint: { type: string, format: uuid }
            previous_scheduled_at: { type: string, format: date-time }
            new_scheduled_at: { type: string, format: date-time }
            speech_id: { type: string }
            tutor_response_id: { type: string }
        created_at:
          type: string
          format: date-time
SafeJob:
  description: >-
    Subject-scoped job view for supervisors. Diagnostic fields (availability,
    failure code, provider usage) and relationships are omitted.
  type: object
  required: [type, id, attributes]
  properties:
    type:
      const: jobs
    id:
      type: string
    attributes:
      type: object
      required:
        - job_type
        - subject_type
        - subject_id
        - state
        - attempt_count
        - created_at
        - started_at
        - finished_at
      properties:
        job_type:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        attempt_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
ResourceIdentifier:
  type: object
  required: [type, id]
  properties:
    type:
      type: string
    id:
      type: string
UserIdentifier:
  type: object
  required: [type, id]
  properties:
    type:
      const: users
    id:
      type: string
ToOneCourse:
  type: object
  required: [data]
  properties:
    data:
      allOf:
        - $ref: '#/ResourceIdentifier'
        - properties:
            type:
              const: courses
ToOneUser:
  type: object
  required: [data]
  properties:
    data:
      allOf:
        - $ref: '#/ResourceIdentifier'
        - properties:
            type:
              const: users
ToOneMaterial:
  type: object
  required: [data]
  properties:
    data:
      allOf:
        - $ref: '#/ResourceIdentifier'
        - properties:
            type:
              const: materials
Brief:
  description: Validated material brief (version 1); encoded content is at most 256 KiB.
  type: object
  required:
    - version
    - summary
    - subjects
    - learning_goals
    - sections
    - warnings
    - educational_level
  properties:
    version:
      const: 1
    summary:
      type: string
      minLength: 1
      maxLength: 4000
    subjects:
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 100
    learning_goals:
      oneOf:
        - type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 300
        - type: 'null'
    sections:
      oneOf:
        - type: array
          maxItems: 500
          items:
            type: object
            required: [sequence, label, title, description, search_terms]
            properties:
              sequence:
                type: integer
                minimum: 1
                description: One-based position matching the array order.
              label:
                type: [string, 'null']
                maxLength: 100
              title:
                type: string
                minLength: 1
                maxLength: 200
              description:
                type: string
                minLength: 1
                maxLength: 500
              search_terms:
                type: [array, 'null']
                maxItems: 10
                items:
                  type: string
                  minLength: 1
                  maxLength: 50
        - type: 'null'
    warnings:
      oneOf:
        - type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        - type: 'null'
    educational_level:
      type: [string, 'null']
      maxLength: 100

TutoringSession:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: tutoring-sessions }
    id: { type: string }
    attributes:
      type: object
      required:
        - course_id
        - student_id
        - state
        - summary
        - follow_up
        - summary_source
        - summary_updated_by
        - summary_lifecycle
        - started_at
        - last_activity_at
        - completed_at
        - summary_updated_at
      properties:
        course_id: { type: string }
        student_id: { type: string }
        state: { type: string, enum: [active, completed] }
        summary: { type: [string, 'null'], maxLength: 16000 }
        follow_up: { type: [string, 'null'], maxLength: 16000 }
        summary_source: { type: [string, 'null'], enum: [generated, supervisor, null] }
        summary_updated_by: { type: [string, 'null'] }
        summary_lifecycle: { $ref: '#/TutoringSummaryLifecycle' }
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        summary_updated_at: { type: [string, 'null'], format: date-time }
    relationships:
      type: object
      properties:
        materials:
          type: object
          required: [data]
          properties:
            data:
              type: array
              uniqueItems: true
              items:
                allOf:
                  - $ref: '#/ResourceIdentifier'
                  - properties:
                      type: { const: materials }

TutoringSummaryLifecycle:
  description: Authorized domain state; it exposes no generic job identity, attempts, diagnostics, or usage.
  type: object
  additionalProperties: false
  required: [state, state_changed_at, last_checked_at, retry_scheduled_for, regeneration_available]
  properties:
    state:
      type: string
      description: >-
        Automatic-retry-scheduled is reserved for a delayed transient retry. Initial work and immediate startup
        recovery are queued and have no retry_scheduled_for value. A migrated delayed retry may have null
        state_changed_at when its historical transition instant cannot be recovered.
      enum:
        - queued
        - generating
        - automatic-retry-scheduled
        - generated
        - supervisor-corrected
        - terminal-failure
        - unavailable
    state_changed_at: { type: [string, 'null'], format: date-time }
    last_checked_at: { type: string, format: date-time }
    retry_scheduled_for:
      type: [string, 'null']
      format: date-time
      description: Present only while an automatic retry is scheduled.
    regeneration_available:
      type: boolean
      description: True only for an assigned supervisor when the domain regeneration preconditions currently hold.

ActiveTutoringSession:
  description: Minimal owned active-session projection for cross-course navigation and reconciliation.
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: tutoring-sessions }
    id: { type: string }
    attributes:
      type: object
      required: [course_id, course_name, state, started_at, last_activity_at]
      properties:
        course_id: { type: string }
        course_name: { type: string, minLength: 1, maxLength: 200 }
        state: { const: active }
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }

TutorResponse:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: tutor-responses }
    id: { type: string }
    attributes:
      type: object
      required:
        - session_id
        - message_id
        - retry_of_response_id
        - attempt
        - state
        - content
        - failure_code
        - created_at
        - started_at
        - finished_at
      properties:
        session_id: { type: string }
        message_id: { type: string }
        retry_of_response_id: { type: [string, 'null'] }
        attempt: { type: integer, minimum: 1 }
        state: { type: string, enum: [queued, generating, completed, interrupted, failed] }
        content: { $ref: '#/TutorResponseContent' }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

GeneratedSpeech:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: generated-speech }
    id: { type: string }
    attributes:
      type: object
      required: [tutor_response_id, state, failure_code, generated_at, expires_at]
      properties:
        tutor_response_id: { type: string }
        state: { type: string, enum: [generating, available, failed] }
        failure_code:
          type: [string, 'null']
          enum:
            - null
            - speech_provider_failed
            - speech_publication_failed
            - speech_commit_failed
            - speech_shutdown
            - speech_restart_interrupted
        generated_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

StudentMessage:
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: student-messages }
    id: { type: string }
    attributes:
      type: object
      required: [session_id, sequence, content, created_at, response]
      properties:
        session_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        content: { $ref: ../requests/requests.yaml#/StudentMessageContent }
        created_at: { type: string, format: date-time }
        response: { $ref: '#/TutorResponse' }

TutoringWork:
  description: Atomic owner-only projection of persisted session work and server-authored action eligibility.
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: tutoring-work-states }
    id:
      type: string
      description: The tutoring-session ID.
    attributes:
      type: object
      required:
        - session_state
        - state
        - remaining_queue_capacity
        - generating_response
        - queued_work
        - latest_response
        - reconciled_message
        - reconciled_response
        - actions
      properties:
        session_state: { type: string, enum: [active, completed] }
        state: { type: string, enum: [idle, generating, queued, generating_and_queued, completed] }
        remaining_queue_capacity: { type: integer, minimum: 0, maximum: 1 }
        generating_response:
          oneOf:
            - { $ref: '#/TutorResponse' }
            - type: 'null'
        queued_work:
          oneOf:
            - { $ref: '#/StudentMessage' }
            - type: 'null'
        latest_response:
          oneOf:
            - { $ref: '#/TutorResponse' }
            - type: 'null'
        reconciled_message:
          oneOf:
            - { $ref: '#/StudentMessage' }
            - type: 'null'
        reconciled_response:
          oneOf:
            - { $ref: '#/TutorResponse' }
            - type: 'null'
        actions:
          $ref: '#/TutoringWorkActions'

TutoringWorkActions:
  type: object
  required: [submit, queue, stop, stop_response_ids, retry, retry_response_id, reconnect, reconnect_response_id, finish]
  properties:
    submit: { type: boolean }
    queue: { type: boolean }
    stop: { type: boolean }
    stop_response_ids:
      type: array
      maxItems: 2
      uniqueItems: true
      items: { type: string }
    retry: { type: boolean }
    retry_response_id: { type: [string, 'null'] }
    reconnect: { type: boolean }
    reconnect_response_id: { type: [string, 'null'] }
    finish: { type: boolean }

InterruptedTutorResponse:
  description: The immutable terminal response targeted by the successful Stop operation.
  allOf:
    - { $ref: '#/TutorResponse' }
    - type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          required: [state, finished_at]
          properties:
            state: { const: interrupted }
            finished_at: { type: string, format: date-time }

TutoringStopWork:
  description: Post-Stop work whose reconciliation result is the non-null interrupted target.
  allOf:
    - { $ref: '#/TutoringWork' }
    - type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          required: [reconciled_response]
          properties:
            reconciled_response: { $ref: '#/InterruptedTutorResponse' }

TutoringTurn:
  description: One paginated immutable student-message and tutor-response attempt pair.
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: tutoring-turns }
    id:
      type: string
      description: The paired tutor-response ID, unique across transcript turns.
    attributes:
      type: object
      required: [student_message_id, sequence, student_content, student_message_created_at, response]
      properties:
        student_message_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        student_content: { $ref: ../requests/requests.yaml#/StudentMessageContent }
        student_message_created_at: { type: string, format: date-time }
        response: { $ref: '#/TutorResponse' }

TutoringMaterial:
  description: Minimal identity for material whose content reached the tutor model.
  type: object
  required: [type, id, attributes]
  properties:
    type: { const: materials }
    id: { type: string }
    attributes:
      type: object
      required: [name, kind, scope]
      properties:
        name: { type: string }
        kind: { type: string }
        scope: { type: string, enum: [course-wide, student-private] }

TutorResponseContent:
  type: string
  maxLength: 65536
  x-max-utf8-bytes: 65536
  x-max-model-tokens: 2048
  description: >-
    Partial or completed tutor output. One response is limited to 2,048 model-output tokens and 64 KiB of UTF-8.

TutorResponseEventStream:
  type: string
  contentMediaType: text/event-stream
  description: >-
    UTF-8 Server-Sent Events. Each event uses one `event` line and one JSON `data` line. The stream starts with a
    snapshot, may emit started and delta events, and ends with completed, interrupted, or failed. A heartbeat comment
    is sent after 15 seconds without an event. Each stream write has a 30-second deadline. Raw provider events, tool
    calls, payloads, and errors are excluded.
  x-sse-events:
    snapshot: { $ref: '#/TutorResponseSnapshotEventPayload' }
    started: { $ref: '#/TutorResponseStartedEventPayload' }
    delta: { $ref: '#/TutorResponseDeltaEventPayload' }
    completed: { $ref: '#/TutorResponseCompletedEventPayload' }
    interrupted: { $ref: '#/TutorResponseInterruptedEventPayload' }
    failed: { $ref: '#/TutorResponseFailedEventPayload' }
  x-heartbeat-seconds: 15
  x-write-deadline-seconds: 30

TutorResponseSnapshotEventPayload:
  oneOf:
    - type: object
      required: [state]
      additionalProperties: false
      properties:
        content: { $ref: '#/TutorResponseContent' }
        state: { type: string, enum: [queued, generating, completed, interrupted] }
    - type: object
      required: [state, code]
      additionalProperties: false
      properties:
        content: { $ref: '#/TutorResponseContent' }
        state: { const: failed }
        code: { $ref: '#/TutorResponseFailureCode' }

TutorResponseStartedEventPayload:
  type: object
  required: [state]
  additionalProperties: false
  properties:
    state: { const: generating }

TutorResponseDeltaEventPayload:
  type: object
  required: [text]
  additionalProperties: false
  properties:
    text:
      allOf:
        - $ref: '#/TutorResponseContent'
        - minLength: 1
      description: >-
        One sanitized text delta. All deltas together remain within the response's 2,048-token and 64-KiB limits.

TutorResponseCompletedEventPayload:
  type: object
  required: [state]
  additionalProperties: false
  properties:
    state: { const: completed }

TutorResponseInterruptedEventPayload:
  type: object
  required: [state]
  additionalProperties: false
  properties:
    state: { const: interrupted }

TutorResponseFailedEventPayload:
  type: object
  required: [state, code]
  additionalProperties: false
  properties:
    state: { const: failed }
    code: { $ref: '#/TutorResponseFailureCode' }

TutorResponseFailureCode:
  type: string
  enum:
    - openai_unavailable
    - provider_failure
    - server_shutdown
    - storage_failure
    - tutor_input_invalid
    - worker_restarted

# --- JSON:API document wrappers -------------------------------------------

TutoringSessionDocument:
  type: object
  required: [data]
  properties:
    data: { $ref: '#/TutoringSession' }
ActiveTutoringSessionDocument:
  type: object
  required: [data]
  properties:
    data:
      oneOf:
        - $ref: '#/ActiveTutoringSession'
        - type: 'null'
TutoringSessionCollectionDocument:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items: { $ref: '#/TutoringSession' }
    meta: { $ref: ../json-api/documents.yaml#/PageMeta }
    links: { $ref: ../json-api/documents.yaml#/PageLinks }
StudentMessageDocument:
  type: object
  required: [data]
  properties:
    data: { $ref: '#/StudentMessage' }
StudentMessageMutationDocument:
  description: Definitive submit/replay result with an immediate request-ID reconciliation link.
  type: object
  required: [data, links]
  additionalProperties: false
  properties:
    data: { $ref: '#/StudentMessage' }
    links: { $ref: '#/MessageCurrentWorkLinks' }
TutoringTurnCollectionDocument:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items: { $ref: '#/TutoringTurn' }
    meta: { $ref: ../json-api/documents.yaml#/PageMeta }
    links: { $ref: ../json-api/documents.yaml#/PageLinks }
TutorResponseDocument:
  type: object
  required: [data]
  properties:
    data: { $ref: '#/TutorResponse' }
TutorResponseRetryDocument:
  description: Definitive retry/replay result with an immutable-response reconciliation link.
  type: object
  required: [data, links]
  additionalProperties: false
  properties:
    data: { $ref: '#/TutorResponse' }
    links: { $ref: '#/ResponseCurrentWorkLinks' }
TutoringSessionCompletionDocument:
  description: Completed session with the authoritative completed current-work link.
  type: object
  required: [data, links]
  additionalProperties: false
  properties:
    data: { $ref: '#/TutoringSession' }
    links: { $ref: '#/SessionCurrentWorkLinks' }
TutoringWorkDocument:
  type: object
  required: [data]
  properties:
    data: { $ref: '#/TutoringWork' }
TutoringStopDocument:
  description: Successful Stop result with the terminal target and authoritative post-Stop current work.
  type: object
  required: [data]
  additionalProperties: false
  properties:
    data: { $ref: '#/TutoringStopWork' }

MessageCurrentWorkLinks:
  type: object
  required: [current_work]
  additionalProperties: false
  properties:
    current_work:
      type: string
      format: uri-reference
      pattern: '^/api/v1/tutoring-sessions/ts_[0-9a-f-]+/current-work\?message_request_id=[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples:
        - /api/v1/tutoring-sessions/ts_94d69bc5-3d12-49a2-8fee-1cb0f4b3e452/current-work?message_request_id=01cc7db6-271d-46e7-8707-1527520b035e
      description: >-
        Immediate current-work read whose sole query parameter is this submission's canonical `message_request_id`.
        Its `reconciled_message` identifies the committed message and initial response for the retained request.

ResponseCurrentWorkLinks:
  type: object
  required: [current_work]
  additionalProperties: false
  properties:
    current_work:
      type: string
      format: uri-reference
      pattern: '^/api/v1/tutoring-sessions/ts_[0-9a-f-]+/current-work\?response_id=rsp_[0-9a-f-]+$'
      examples:
        - /api/v1/tutoring-sessions/ts_94d69bc5-3d12-49a2-8fee-1cb0f4b3e452/current-work?response_id=rsp_9193bde0-e12e-4a4c-a489-d5a3dcc24959
      description: >-
        Immediate current-work read whose sole query parameter is the returned immutable `response_id`. Its
        `reconciled_response` identifies this retry response independently from later current work.

SessionCurrentWorkLinks:
  type: object
  required: [current_work]
  additionalProperties: false
  properties:
    current_work:
      type: string
      format: uri-reference
      pattern: '^/api/v1/tutoring-sessions/ts_[0-9a-f-]+/current-work$'
      examples:
        - /api/v1/tutoring-sessions/ts_94d69bc5-3d12-49a2-8fee-1cb0f4b3e452/current-work
      description: Immediate current-work read for the completed session; no reconciliation query is required.
TutoringMaterialCollectionDocument:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items: { $ref: '#/TutoringMaterial' }
    meta: { $ref: ../json-api/documents.yaml#/PageMeta }
    links: { $ref: ../json-api/documents.yaml#/PageLinks }

MentoringSession:
  type: object
  required: [type, id, attributes, relationships]
  properties:
    type: { const: mentoring-sessions }
    id: { type: string }
    attributes:
      type: object
      required: [topic, response, responded_at, responded_by, proposed_for, scheduled_for, meeting_instructions,
        meeting_url, state, created_at, closed_at, closed_by, closure_reason]
      properties:
        topic: { type: string, maxLength: 4000 }
        response: { type: [string, 'null'], maxLength: 8000 }
        responded_at: { type: [string, 'null'], format: date-time }
        responded_by: { type: [string, 'null'] }
        proposed_for: { type: [string, 'null'], format: date-time }
        scheduled_for: { type: [string, 'null'], format: date-time }
        meeting_instructions: { type: [string, 'null'], maxLength: 4000 }
        meeting_url: { type: [string, 'null'], format: uri }
        state: { type: string, enum: [requested, scheduled, cancelled, completed] }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        closed_by: { type: [string, 'null'] }
        closure_reason: { type: [string, 'null'], enum: [cancelled, completed, null] }
    relationships:
      type: object
      required: [course, student, mentor]
      properties:
        course: { $ref: '#/ToOneCourse' }
        student: { $ref: '#/ToOneUser' }
        mentor:
          type: object
          required: [data]
          properties:
            data:
              oneOf:
                - $ref: '#/UserIdentifier'
                - type: 'null'
MentoringSessionDocument:
  type: object
  required: [data]
  properties:
    data: { $ref: '#/MentoringSession' }
MentoringSessionCollectionDocument:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items: { $ref: '#/MentoringSession' }
    meta: { $ref: ../json-api/documents.yaml#/PageMeta }
    links: { $ref: ../json-api/documents.yaml#/PageLinks }
MentorIdentifierCollectionDocument:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items: { $ref: '#/UserIdentifier' }
    meta: { $ref: ../json-api/documents.yaml#/PageMeta }
    links: { $ref: ../json-api/documents.yaml#/PageLinks }
MentorStudentProfile:
  type: object
  required: [type, id, attributes]
  additionalProperties: false
  properties:
    type: { const: users }
    id: { type: string }
    attributes:
      type: object
      required: [username, name, nickname, avatar_url]
      additionalProperties: false

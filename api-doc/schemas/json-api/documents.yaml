ErrorDocument:
  description: >-
    Complete UTF-8 JSON:API error document produced only from the safe central registry. The encoded document is no
    larger than 65,536 bytes; an oversized registry definition is replaced atomically with bounded generic text while
    preserving status and stable code.
  type: object
  required: [errors]
  properties:
    errors:
      type: array
      minItems: 1
      items:
        type: object
        required: [status, code, title, detail]
        properties:
          status:
            type: string
            description: HTTP status as a string.
            maxLength: 3
          code:
            type: string
            description: Stable registered MIA error code.
            maxLength: 128
          title:
            type: string
            maxLength: 1024
          detail:
            type: string
            description: Neutral detail that never reveals resource existence.
            maxLength: 65536
PageMeta:
  description: Pagination metadata attached to every paginated collection.
  type: object
  required: [has_more]
  properties:
    has_more:
      type: boolean
      description: Whether more items exist beyond this page.
PageLinks:
  description: >-
    Navigation links for paginated collections. `prev` and `next` are present
    only when those pages exist; absent links are omitted rather than null.
  type: object
  properties:
    prev:
      type: string
      description: Relative URL of the previous page.
    next:
      type: string
      description: Relative URL of the next page.
BinaryPayload:
  type: string
  format: binary
NDJSONPayload:
  type: string
  description: UTF-8 NDJSON stream containing one normalized content segment per line.
